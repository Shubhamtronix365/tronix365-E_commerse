    <!-- Google Customer Reviews Badge Widget (Deferred until browser idle to eliminate render blocking) -->
    <script>
      (function() {
        var loadGcr = function() {
          if (document.getElementById('merchantWidgetScript')) return;
          var s = document.createElement('script');
          s.id = 'merchantWidgetScript';
          s.src = 'https://www.gstatic.com/shopping/merchant/merchantwidget.js';
          s.async = true;
          s.onload = function() {
            if (window.merchantwidget && window.merchantwidget.start && !window.__gcr_badge_initialized) {
              window.__gcr_badge_initialized = true;
              try {
                window.merchantwidget.start({
                  merchant_id: 5820417048,
                  position: "BOTTOM_LEFT"
                });
              } catch (e) {
                console.error("[GCR Badge] Error starting merchant widget:", e);
              }
            }
          };
          document.body.appendChild(s);
        };

        if (document.readyState === 'complete') {
          if ('requestIdleCallback' in window) {
            requestIdleCallback(loadGcr);
          } else {
            setTimeout(loadGcr, 2000);
          }
        } else {
          window.addEventListener('load', function() {
            if ('requestIdleCallback' in window) {
              requestIdleCallback(loadGcr);
            } else {
              setTimeout(loadGcr, 2000);
            }
          });
        }
      })();
